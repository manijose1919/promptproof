name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full test suite on the versions our test tooling (vitest 4) supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Prove the published artifact actually runs on the minimum supported runtime
  # (engines.node >= 18) by building and running the real CLI there.
  compat-node18:
    runs-on: ubuntu-latest
    name: node 18 runtime compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the example suite through the built CLI (node 18)
        run: node dist/cli.js run examples/greeting.suite.yaml --reporter github
